plugins {
    id 'com.android.application'
}

android {
    namespace 'eu.pitedigital.sunmiscanner'
    compileSdk 34

    defaultConfig {
        applicationId "eu.pitedigital.sunmiscanner"
        minSdk 21
        targetSdk 25
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
